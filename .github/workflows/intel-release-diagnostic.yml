name: Intel Release compilation diagnostic
on:
  push:
    branches: [codex/v0.1.2-intel-diagnostic]
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-26-intel
    env:
      BIPARA_RELEASE_BUILD: '1'
      BIPARA_TARGET_ARCH: x86_64
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          enable-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Build pinned worker
        run: |
          mkdir -p .local/logs
          script/build_worker.sh --release-only > .local/logs/worker.log 2>&1
      - name: Diagnose native x86_64 Release compilation
        run: |
          xcodebuild -version
          xcrun swiftc -version
          if xcodebuild -project Bipara.xcodeproj -scheme Bipara -configuration Release -destination generic/platform=macOS ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO -derivedDataPath build/tagged-release CODE_SIGNING_ALLOWED=NO build > .local/logs/native.log 2>&1; then
            echo "Intel Release build succeeded"
          else
            python3 - <<'PY'
          import os, re
          from pathlib import Path
          for line in Path('.local/logs/native.log').read_text(errors='replace').splitlines():
              if re.search(r'error:|fatal error|Stack dump|Please submit|failed with|\*\* BUILD FAILED', line, re.I) and not re.search(r'(^|\s)swift-frontend\s|invocation:', line, re.I):
                  print(line.replace(os.environ['GITHUB_WORKSPACE'], '<checkout>')[:400])
          PY
            exit 1
          fi
