[project]
name = "bipara-worker"
version = "0.1.0"
description = "Bipara bundled Python model worker (local pipe process, no listener)"
requires-python = "==3.13.*"
dependencies = [
    "langchain-core==1.7.3",
    "langchain-openai==1.7.3",
    "pydantic==2.14.2",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "jsonschema==4.26.0",
    "pyinstaller==6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bipara_worker"]
